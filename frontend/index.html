<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="여러 기술 뉴스-블로그의 새 글을 한곳에 모아 보는 피드" />
    <!-- 같은 도형이지만 작은 쪽은 획을 굵게 잡아 뒀다. 브라우저가 sizes를 보고 고른다. -->
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/favicon-32.svg" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon-16.svg" />
    <title>devhub</title>
    <script>
      // 첫 페인트 전에 테마를 정해야 밝은 화면이 번쩍이지 않는다.
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("devhub-theme");
        } catch {}
        const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = stored === "light" || stored === "dark" ? stored : system;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
