services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?DB name is required}
      POSTGRES_USER: ${POSTGRES_USER:?User name is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Password is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DEVHUB_COLLECT_ENABLED: ${DEVHUB_COLLECT_ENABLED:-false}
      DEVHUB_COLLECT_INTERVAL: ${DEVHUB_COLLECT_INTERVAL:-PT30M}
      DEVHUB_COLLECT_EXECUTION_CONCURRENCY: ${DEVHUB_COLLECT_EXECUTION_CONCURRENCY:-8}
      DEVHUB_COLLECT_HTTP_CONNECT_TIMEOUT: ${DEVHUB_COLLECT_HTTP_CONNECT_TIMEOUT:-5s}
      DEVHUB_COLLECT_HTTP_READ_TIMEOUT: ${DEVHUB_COLLECT_HTTP_READ_TIMEOUT:-10s}
      DEVHUB_COLLECT_HTTP_MAX_BODY_SIZE: ${DEVHUB_COLLECT_HTTP_MAX_BODY_SIZE:-10MB}
      DEVHUB_COLLECT_HTTP_MAX_REDIRECTS: ${DEVHUB_COLLECT_HTTP_MAX_REDIRECTS:-5}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: