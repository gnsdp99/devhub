services:
  api:
    image: ${DEVHUB_IMAGE:?Image reference is required}
    restart: unless-stopped
    env_file: .env
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: ${DEVHUB_MEM_LIMIT:-1500m}
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"