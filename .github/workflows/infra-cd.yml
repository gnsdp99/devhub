name: infra-cd

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'compose.prod.yaml'
      - '.github/workflows/infra-cd.yml'

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    # 수동 실행은 어느 브랜치에서나 할 수 있으므로 main이 아니면 막는다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ec2
    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - if: github.event_name == 'push'
        run: deploy/scripts/ssm-deploy.sh

      - if: github.event_name == 'workflow_dispatch'
        run: deploy/scripts/ssm-reload.sh