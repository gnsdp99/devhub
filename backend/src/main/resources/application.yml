spring:
  application:
    name: devhub
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true

devhub:
  collect:
    enabled: ${DEVHUB_COLLECT_ENABLED:false}
    interval: ${DEVHUB_COLLECT_INTERVAL:PT30M}
    execution:
      concurrency: ${DEVHUB_COLLECT_EXECUTION_CONCURRENCY:8}
    http:
      connect-timeout: ${DEVHUB_COLLECT_HTTP_CONNECT_TIMEOUT:5s}
      read-timeout: ${DEVHUB_COLLECT_HTTP_READ_TIMEOUT:10s}
      max-body-size: ${DEVHUB_COLLECT_HTTP_MAX_BODY_SIZE:10MB}
      max-redirects: ${DEVHUB_COLLECT_HTTP_MAX_REDIRECTS:5}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never