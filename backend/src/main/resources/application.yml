spring:
  application:
    name: devhub
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true

devhub:
  collect:
    enabled: ${DEVHUB_COLLECT_ENABLED:false}
    interval: ${DEVHUB_COLLECT_INTERVAL:PT30M}
    window: ${DEVHUB_COLLECT_WINDOW:P30D}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never